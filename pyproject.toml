[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-widget"
version = "0.1.0"
description = "Compact desktop widget for Claude usage on Windows and Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "platformdirs>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
claude-usage-widget = "claude_usage_widget.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage_widget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
